.circles{

@keyframes animate {

    0%{
        transform: translateY(0) rotate(0deg);
        opacity: 1;
        border-radius: 0;
    }

    100%{
        transform: translateY(-1000px) rotate(720deg);
        opacity: 0;
        border-radius: 50%;

.slide {
width: 200px;
height: 132px;
overflow: hidden;
position: absolute;
top: 111%;
right: 20%;
border-radius: 25px;
}
.slide > div {
width: 200px;
height: 132px;
  background-size: cover;
  position: absolute;
  animation: slide 25s infinite;
  opacity: 0;

.slide > div:nth-child(1) {
